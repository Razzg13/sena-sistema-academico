# ============================================================
# PERFIL "railway": conexion al servicio MySQL de Railway.
# Se activa con la variable SPRING_PROFILES_ACTIVE=railway en Railway.
# Railway entrega solo estas variables: MYSQLHOST, MYSQLPORT,
# MYSQLDATABASE, MYSQLUSER y MYSQLPASSWORD.
# ============================================================
spring.datasource.url=jdbc:mysql://${MYSQLHOST}:${MYSQLPORT}/${MYSQLDATABASE}?allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.username=${MYSQLUSER}
spring.datasource.password=${MYSQLPASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
