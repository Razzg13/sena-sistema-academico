<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <link rel="icon" th:href="@{/favicon.ico}"/>
    <title>Restablecer clave - Sistema Academico SENA</title>
    <link rel="stylesheet" th:href="@{/css/main.css}"/>
</head>
<body>
    <div th:replace="~{fragments/layout :: barra}"></div>

    <div class="contenedor">
        <div class="mensaje-error" th:if="${error}" th:text="${error}"></div>
        <div class="tarjeta" style="max-width:500px;margin:0 auto;">
            <h2>Restablecer clave</h2>
            <p class="texto-ayuda" th:text="${usuario.nombreCompleto} + ' · ' + ${usuario.correo}"></p>
            <form th:action="@{/usuarios/{id}/clave(id=${usuario.id})}" method="post">
                <div class="campo">
                    <label>Clave nueva (minimo 6 caracteres)</label>
                    <input type="password" name="clave" required minlength="6" autocomplete="new-password"/>
                </div>
                <button type="submit" class="boton ancho-completo">Guardar clave</button>
                <a th:href="@{/usuarios}" class="boton secundario ancho-completo" style="margin-top:0.5rem;display:block;text-align:center;">Cancelar</a>
            </form>
        </div>
    </div>
</body>
</html>
