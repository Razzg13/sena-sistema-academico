spring.application.name=sena-cipa-web
server.port=${PORT:8080}

spring.datasource.url=jdbc:h2:mem:sena_cipa;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
# Las pantallas (la V de MVC) estan en src/main/resources/vista/
spring.thymeleaf.prefix=classpath:/vista/
spring.thymeleaf.cache=false

# Con la base H2 de prueba se cargan los mismos datos de ejemplo del script de MySQL
# (solo aplica a bases embebidas; con MySQL no se ejecuta).
spring.jpa.defer-datasource-initialization=true
spring.sql.init.data-locations=classpath:datos-ejemplo.sql

# Muestra las cuentas de prueba en el login y las mantiene con su clave conocida.
# Con H2 se activa solo; en produccion debe quedar en false.
app.cuentas-demo=false
