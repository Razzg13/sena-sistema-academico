spring.application.name=sistema-academico

# Perfil activo: 'dev' (H2 en memoria) por defecto. En un servidor real se sobreescribe
# con la variable de entorno SPRING_PROFILES_ACTIVE=mysql (ver application-mysql.properties),
# sin tener que tocar este archivo ni recompilar.
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# Puerto: la mayoria de plataformas de despliegue (Railway, Render, Heroku...) asignan el
# puerto por variable de entorno PORT. Localmente, sin esa variable, usa 8080 igual que siempre.
server.port=${PORT:8080}

# Carga de evidencias (RF-12/RF-13): limite de tamano igual al validado en
# ArchivoAlmacenamientoService (10 MB), con margen para el resto del formulario.
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB

# Carpeta donde se guardan los archivos de evidencias (almacenamiento local, RNF).
sena.almacenamiento.ruta=./almacenamiento
