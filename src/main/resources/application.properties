# ============================================================
# CONFIGURACION BASE (se usa siempre).
# Sin perfil, la app usa una base H2 en memoria para pruebas.
# Para MySQL se activa un perfil, que cambia solo la conexion:
#   mysql   -> application-mysql.properties   (MySQL local o del profesor)
#   railway -> application-railway.properties (MySQL en Railway)
# La clase que crea la conexion es com.sena.cipa.conexion.ConexionBaseDatos
# ============================================================

spring.application.name=sena-cipa-web
# Puerto del servidor web (Railway lo cambia con la variable PORT)
server.port=${PORT:8080}

# ---- Conexion a la base de datos (H2 en memoria, se borra al apagar) ----
spring.datasource.url=jdbc:h2:mem:sena_cipa;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ---- Hibernate (JPA) ----
# update: crea las tablas o columnas que falten segun las clases de modelo/
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# ---- Archivos que suben los aprendices (maximo 5 MB) ----
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
# Las pantallas (la V de MVC) estan en src/main/resources/vista/
spring.thymeleaf.prefix=classpath:/vista/
spring.thymeleaf.cache=false

# Con la base H2 de prueba se cargan los mismos datos de ejemplo del script de MySQL
# (solo aplica a bases embebidas; con MySQL no se ejecuta).
spring.jpa.defer-datasource-initialization=true
spring.sql.init.data-locations=classpath:datos-ejemplo.sql

# Muestra las cuentas de prueba en el login y las mantiene con su clave conocida.
# Con H2 se activa solo; en produccion debe quedar en false.
app.cuentas-demo=false
