<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <link rel="icon" th:href="@{/favicon.ico}"/>
    <title>Sesiones - Sistema Academico SENA</title>
    <link rel="stylesheet" th:href="@{/css/main.css}"/>
</head>
<body>
    <div th:replace="~{fragments/layout :: barra}"></div>

    <div class="contenedor">
        <div class="mensaje-exito" th:if="${mensaje}" th:text="${mensaje}"></div>
        <div class="mensaje-error" th:if="${error}" th:text="${error}"></div>

        <div class="encabezado-seccion">
            <h2>Sesiones de formacion</h2>
            <a class="boton" th:href="@{/sesiones/nuevo}">+ Nueva sesion</a>
        </div>

        <div class="tarjeta">
            <table>
                <thead>
                <tr>
                    <th>Ficha</th>
                    <th>Fecha</th>
                    <th>Hora</th>
                    <th>Tema</th>
                    <th>Acciones</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="sesion : ${sesiones}">
                    <td th:text="${sesion.ficha.numero}"></td>
                    <td th:text="${sesion.fecha}"></td>
                    <td th:text="${sesion.horaInicio} + ' - ' + ${sesion.horaFin}"></td>
                    <td th:text="${sesion.tema}"></td>
                    <td class="acciones-tabla">
                        <a th:href="@{/sesiones/{id}/llamado(id=${sesion.id})}">Tomar asistencia</a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</body>
</html>
