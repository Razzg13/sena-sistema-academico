<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Instructores | Sistema Académico SENA</title>
    <link rel="stylesheet" th:href="@{/css/main.css}">
</head>
<body>
    <header class="app-header">
        <strong>SENA | Instructores</strong>
        <a th:href="@{/inicio}">← Volver al inicio</a>
    </header>
    <main>
        <h1>Instructores</h1>
        <p class="mensaje" th:if="${mensaje}" th:text="${mensaje}"></p>
        <p class="error" th:if="${error}" th:text="${error}"></p>

        <p class="vacio" th:if="${instructores.empty}">No hay instructores registrados.</p>

        <table th:unless="${instructores.empty}">
            <thead><tr><th>Nombre</th><th>Correo</th><th>Especialidad</th></tr></thead>
            <tbody>
                <tr th:each="i : ${instructores}">
                    <td th:text="${i.usuario.nombreCompleto}"></td>
                    <td th:text="${i.usuario.correo}"></td>
                    <td th:text="${i.especialidad}"></td>
                </tr>
            </tbody>
        </table>

        <h2>Crear perfil de instructor</h2>
        <p style="color:#666; font-size:0.85rem;">El usuario debe existir previamente y tener el rol INSTRUCTOR asignado.</p>
        <form class="tarjeta" th:action="@{/coordinacion/instructores}" method="post">
            <div>
                <label for="correo">Correo del usuario</label>
                <input type="email" id="correo" name="correo" required>
            </div>
            <div>
                <label for="especialidad">Especialidad</label>
                <input type="text" id="especialidad" name="especialidad" required>
            </div>
            <button class="btn" type="submit">Crear</button>
        </form>
    </main>
</body>
</html>
