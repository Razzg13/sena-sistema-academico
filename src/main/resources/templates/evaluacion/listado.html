<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <link rel="icon" th:href="@{/favicon.ico}"/>
    <title>Actividades evaluativas - Sistema Academico SENA</title>
    <link rel="stylesheet" th:href="@{/css/main.css}"/>
</head>
<body>
    <div th:replace="~{fragments/layout :: barra}"></div>

    <div class="contenedor">
        <div class="mensaje-exito" th:if="${mensaje}" th:text="${mensaje}"></div>
        <div class="mensaje-error" th:if="${error}" th:text="${error}"></div>

        <div class="encabezado-seccion">
            <h2>Actividades evaluativas</h2>
            <a class="boton" th:href="@{/actividades/nuevo}">+ Nueva actividad</a>
        </div>

        <p class="texto-ayuda" th:if="${soloMisFichas}">Solo se muestran las actividades de las fichas que tienes asignadas.</p>

        <div class="tarjeta">
            <table th:if="${!filas.isEmpty()}">
                <thead>
                <tr>
                    <th>Ficha</th>
                    <th>Actividad</th>
                    <th>Fecha limite</th>
                    <th>Entregas</th>
                    <th>Calificadas</th>
                    <th>Acciones</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="fila : ${filas}">
                    <td th:text="${fila.actividad.ficha.numero}"></td>
                    <td th:text="${fila.actividad.nombre}"></td>
                    <td th:text="${fila.actividad.fechaLimite}"></td>
                    <td th:text="${fila.entregas} + ' / ' + ${fila.matriculados}"></td>
                    <td th:text="${fila.calificadas} + ' / ' + ${fila.matriculados}"></td>
                    <td class="acciones-tabla">
                        <a th:href="@{/actividades/{id}/calificar(id=${fila.actividad.id})}">Calificar</a>
                    </td>
                </tr>
                </tbody>
            </table>
            <p th:if="${filas.isEmpty()}">Todavia no hay actividades para mostrar.</p>
        </div>
    </div>
</body>
</html>
