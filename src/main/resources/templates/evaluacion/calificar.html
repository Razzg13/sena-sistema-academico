<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <link rel="icon" th:href="@{/favicon.ico}"/>
    <title>Calificar - Sistema Academico SENA</title>
    <link rel="stylesheet" th:href="@{/css/main.css}"/>
</head>
<body>
    <div th:replace="~{fragments/layout :: barra}"></div>

    <div class="contenedor">
        <div class="tarjeta">
            <div class="mensaje-error" th:if="${error}" th:text="${error}"></div>
            <h2 th:text="${actividad.nombre}"></h2>
            <p th:text="'Ficha ' + ${actividad.ficha.numero} + ' · Fecha limite: ' + ${actividad.fechaLimite}"></p>

            <form th:action="@{/actividades/{id}/calificar(id=${actividad.id})}" th:object="${form}" method="post">
                <table>
                    <thead>
                    <tr>
                        <th>Aprendiz</th>
                        <th>Entrega</th>
                        <th>Calificacion</th>
                        <th>Juicio</th>
                        <th>Retroalimentacion</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="item, iter : *{items}">
                        <td th:text="${item.nombreAprendiz}"></td>
                        <td>
                            <div th:if="${item.tieneEntrega}">
                                <span th:text="${item.entregaFecha}"></span>
                                <span class="etiqueta estado-vencida" th:if="${item.entregaTardia}">Tardia</span>
                                <p class="texto-ayuda" th:if="${item.entregaComentario != null and !item.entregaComentario.isBlank()}"
                                   th:text="${item.entregaComentario}"></p>
                                <a th:if="${item.entregaArchivo != null}" th:href="@{/entregas/{id}/archivo(id=${item.entregaId})}"
                                   th:text="'Descargar ' + ${item.entregaArchivo}"></a>
                            </div>
                            <span class="etiqueta inactivo" th:unless="${item.tieneEntrega}">Sin entrega</span>
                        </td>
                        <td>
                            <input type="hidden" th:field="*{items[__${iter.index}__].matriculaId}"/>
                            <input type="number" step="0.01" min="0" max="5"
                                   th:field="*{items[__${iter.index}__].calificacion}"/>
                        </td>
                        <td>
                            <select th:field="*{items[__${iter.index}__].juicio}">
                                <option th:each="j : ${juicios}" th:value="${j}" th:text="${j}"></option>
                            </select>
                        </td>
                        <td>
                            <input type="text" th:field="*{items[__${iter.index}__].retroalimentacion}"/>
                        </td>
                    </tr>
                    </tbody>
                </table>

                <p th:if="${form.items.isEmpty()}">Esta ficha no tiene aprendices matriculados.</p>
                <button type="submit" class="boton" th:unless="${form.items.isEmpty()}">Guardar calificaciones</button>
            </form>
        </div>
    </div>
</body>
</html>
