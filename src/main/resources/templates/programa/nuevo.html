<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Nuevo programa | Sistema Académico SENA</title>
    <link rel="stylesheet" th:href="@{/css/main.css}">
</head>
<body>
    <header class="app-header">
        <strong>SENA | Programas</strong>
        <a th:href="@{/coordinacion/programas}">← Volver al listado</a>
    </header>
    <main>
        <h1>Nuevo programa</h1>

        <form class="tarjeta" th:action="@{/coordinacion/programas}" th:object="${form}" method="post">
            <div>
                <label for="codigo">Código</label>
                <input type="text" id="codigo" th:field="*{codigo}" required>
            </div>
            <div>
                <label for="nombre">Nombre</label>
                <input type="text" id="nombre" th:field="*{nombre}" required>
            </div>
            <div>
                <label for="nivel">Nivel</label>
                <select id="nivel" th:field="*{nivel}" required>
                    <option value="">Seleccione...</option>
                    <option th:each="n : ${niveles}" th:value="${n}" th:text="${n}"></option>
                </select>
            </div>
            <div>
                <label for="version">Versión</label>
                <input type="text" id="version" th:field="*{version}" required>
            </div>
            <div>
                <label for="duracionHoras">Duración (horas)</label>
                <input type="number" id="duracionHoras" th:field="*{duracionHoras}" min="1" required>
            </div>
            <button class="btn" type="submit">Guardar</button>
        </form>
    </main>
</body>
</html>
