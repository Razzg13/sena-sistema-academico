<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
    <aside th:fragment="barra" class="sidebar">
        <div class="sidebar-marca">
            <img th:src="@{/img/logo_sena_blanco.png}" alt="Logo SENA"/>
            <div class="sidebar-marca-texto">
                <strong>CIPA</strong>
                <span>Sistema Academico</span>
            </div>
        </div>

        <nav class="sidebar-nav">
            <a th:href="@{/inicio}" class="sidebar-link">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9.5 12 3l9 6.5"/><path d="M5 10v10a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1V10"/></svg>
                <span>Inicio</span>
            </a>
            <a th:href="@{/programas}" class="sidebar-link" sec:authorize="hasAnyRole('ADMINISTRADOR','COORDINACION_ACADEMICA')">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
                <span>Programas</span>
            </a>
            <a th:href="@{/fichas}" class="sidebar-link" sec:authorize="hasAnyRole('ADMINISTRADOR','COORDINACION_ACADEMICA')">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M3 12h18"/></svg>
                <span>Fichas</span>
            </a>
            <a th:href="@{/instructores}" class="sidebar-link" sec:authorize="hasAnyRole('ADMINISTRADOR','COORDINACION_ACADEMICA')">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="m17 11 2 2 4-4"/></svg>
                <span>Instructores</span>
            </a>
            <a th:href="@{/aprendices}" class="sidebar-link" sec:authorize="hasAnyRole('ADMINISTRADOR','COORDINACION_ACADEMICA')">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
                <span>Aprendices</span>
            </a>
            <a th:href="@{/sesiones}" class="sidebar-link" sec:authorize="hasAnyRole('ADMINISTRADOR','COORDINACION_ACADEMICA','INSTRUCTOR')">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4"/><path d="M8 2v4"/><path d="M3 10h18"/></svg>
                <span>Sesiones</span>
            </a>
            <a th:href="@{/actividades}" class="sidebar-link" sec:authorize="hasAnyRole('ADMINISTRADOR','COORDINACION_ACADEMICA','INSTRUCTOR')">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 11 3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
                <span>Evaluaciones</span>
            </a>
            <a th:href="@{/usuarios}" class="sidebar-link" sec:authorize="hasRole('ADMINISTRADOR')">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
                <span>Usuarios</span>
            </a>
        </nav>

        <div class="sidebar-footer">
            <div class="sidebar-usuario">
                <div class="sidebar-avatar">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                </div>
                <div class="sidebar-usuario-texto">
                    <strong sec:authentication="principal.usuario.nombreCompleto">Usuario</strong>
                    <span sec:authentication="principal.usuario.rol">ROL</span>
                </div>
            </div>
            <form th:action="@{/logout}" method="post">
                <button type="submit" class="sidebar-salir" title="Cerrar sesion">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>
                </button>
            </form>
        </div>
    </aside>
</body>
</html>
