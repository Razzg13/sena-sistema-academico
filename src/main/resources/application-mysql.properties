# ============================================================
# PERFIL "mysql": conexion a MySQL (local o el computador del profesor).
# Se activa con: --spring.profiles.active=mysql
# Datos de conexion (se pasan al arrancar, por ejemplo en iniciar-mysql.bat
# o en bin/setenv de Tomcat):
#   DB_URL       jdbc:mysql://localhost:3306/sena_basico?allowPublicKeyRetrieval=true&useSSL=false
#   DB_USERNAME  usuario de MySQL (por defecto root)
#   DB_PASSWORD  clave de MySQL
# Si no hay DB_URL, arma la conexion con las variables MYSQL* (como en Railway).
# ============================================================
spring.datasource.url=${DB_URL:jdbc:mysql://${MYSQLHOST:localhost}:${MYSQLPORT:3306}/${MYSQLDATABASE:sena_basico}?allowPublicKeyRetrieval=true&useSSL=false}
spring.datasource.username=${DB_USERNAME:${MYSQLUSER:root}}
spring.datasource.password=${DB_PASSWORD:${MYSQLPASSWORD:}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
