# Perfil MySQL: sirve tanto para correrlo localmente contra un MySQL instalado en tu equipo
# como para un despliegue real (Railway, Render, un VPS, etc.). Todo se lee de variables de
# entorno con un valor por defecto que apunta a un MySQL local, asi que:
#   - En tu equipo: si no defines nada, se conecta a localhost:3306/sena_academico con root
#     sin contrasena (crea antes la base: CREATE DATABASE sena_academico;).
#   - En un servidor: defines MYSQLHOST/MYSQLPORT/MYSQLDATABASE/MYSQLUSER/MYSQLPASSWORD segun
#     los datos que te de la plataforma (Railway los nombra exactamente asi en su plugin MySQL).
spring.datasource.url=jdbc:mysql://${MYSQLHOST:localhost}:${MYSQLPORT:3306}/${MYSQLDATABASE:sena_academico}?useSSL=false&serverTimezone=America/Bogota
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${MYSQLUSER:root}
spring.datasource.password=${MYSQLPASSWORD:123456}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=false
